[project]
name = "platform-support-agent"
version = "0.1.0"
description = "Internal platform-support agent: grounded answers over a help center, role-gated tools, human-confirmed actions."
requires-python = ">=3.11"

# The core (retrieval, RBAC, tools, eval harness) is intentionally stdlib-only so
# `make eval` runs on a clean checkout with no API keys and no network.
dependencies = []

[project.optional-dependencies]
# Installed once you wire a real model provider in week 2-3.
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
openai = ["openai>=1.40"]
vertex = ["google-cloud-aiplatform>=1.60"]
mcp = ["mcp>=1.0"]
ui = ["streamlit>=1.37"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
psa-eval = "psa.evals.runner:main"
psa-index = "psa.rag.index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psa"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly. Ruff's default rule set changes between releases, which would
# turn a routine `pip install ruff` in CI into an unrelated red build.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The UI prepends src/ to sys.path before importing psa, so imports cannot come first.
"ui/app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
